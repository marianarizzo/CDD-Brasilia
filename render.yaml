services:
  - type: web
    name: cdd-brasilia-etiquetas
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CDD_NAME
        value: CDD BRASÍLIA
      - key: CDD_DB_PATH
        value: /var/data/app.db
    disk:
      name: etiquetas-data
      mountPath: /var/data
      sizeGB: 1
